services:
  # 1. Base de Datos PostgreSQL con soporte para volúmenes
  db:
    image: postgres:16-alpine
    container_name: docs_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docs_password}
      POSTGRES_DB: ${POSTGRES_DB:-docs_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docs_user} -d ${POSTGRES_DB:-docs_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Backend (NestJS)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docs_backend_api
    restart: always
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  # 3. Frontend (React + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docs_frontend_app
    restart: always
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data: